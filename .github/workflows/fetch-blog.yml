name: 블로그 글 주 1회 수집

# 매주 월요일 오전 9시(한국) — 새 글이 있으면 data/blog-posts.json이 바뀌고,
# 커밋이 올라가면 Vercel이 알아서 다시 배포한다. 수동 실행도 가능하다.
on:
  schedule:
    - cron: '0 0 * * 1'   # 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      force:
        description: '본문을 전부 다시 받으려면 1'
        required: false
        default: '0'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 블로그 글 수집
        env:
          NAVER_BLOG_ID: lovenpositive
          FORCE_REFETCH: ${{ github.event.inputs.force || '0' }}
        run: node scripts/fetch-blog.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog-posts.json
          if git diff --cached --quiet; then
            echo "새 글 없음 — 커밋하지 않는다."
          else
            git commit -m "블로그 글 수집 (자동)"
            git push
          fi
